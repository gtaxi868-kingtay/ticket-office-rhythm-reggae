<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option C — Poster Pop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap');
*{box-sizing:border-box} body{margin:0;background:#FFF6EC;color:#17252B;font-family:Archivo,system-ui,sans-serif}
.phone{max-width:430px;margin:0 auto;padding:22px 18px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.01em}
.brand span{color:#E85D1F}
.pill{background:#0E7C86;color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.poster{width:100%;border-radius:24px;display:block;border:3px solid #17252B;box-shadow:7px 7px 0 #0E7C86}
h1{font-size:34px;font-weight:900;text-transform:uppercase;line-height:.98;margin:20px 0 6px}
.meta{color:#5A6B72;font-size:14px;font-weight:700;margin-bottom:20px}
.card{background:#fff;border:2.5px solid #17252B;border-radius:22px;padding:4px 16px;box-shadow:6px 6px 0 #F2B035;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px dashed #E4D9C8}
.row:last-child{border-bottom:none}
.row b{font-size:16px;font-weight:900}.row small{display:block;color:#E85D1F;font-weight:700;margin-top:2px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:37px;height:37px;border-radius:12px;border:2.5px solid #17252B;background:#F2B035;color:#17252B;font-size:19px;font-weight:900}
.step button.minus{background:#fff}
.step .q{font-weight:900;min-width:18px;text-align:center}
.sum{background:#0E7C86;color:#fff;border-radius:22px;padding:18px;border:2.5px solid #17252B}
.sum .r{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;font-weight:700}
.sum .tot{border-top:2px solid rgba(255,255,255,.35);margin-top:8px;padding-top:11px;font-size:19px;font-weight:900}
.note{font-size:13px;line-height:1.5;margin-top:10px;color:#D9F2F0;font-weight:500}
.cta{display:block;width:100%;margin-top:18px;background:#E85D1F;color:#fff;border:2.5px solid #17252B;border-radius:16px;padding:17px;font-size:17px;font-weight:900;text-transform:uppercase;box-shadow:6px 6px 0 #17252B}
.foot{text-align:center;color:#8A97A0;font-size:12px;margin-top:18px;font-weight:700}
</style></head><body><div class="phone">
<div class="top"><div class="brand">Ticket<span>Office</span></div><div class="pill">OPTION C</div></div>
<img class="poster" src="https://sjrubwotogjaxzeapndh.supabase.co/storage/v1/object/public/flyers/rhythm-reggae.jpg" alt="Rhythm and Reggae flyer">
<h1>Rhythm &amp; Reggae</h1>
<div class="meta">SAT 28 NOV 2026 • 7:00 PM – 1:00 AM • CAMP OGDEN</div>
<div class="card">
  <div class="row"><div><b>General</b><small>TT$100</small></div><div class="step"><button class="minus">−</button><span class="q">2</span><button>+</button></div></div>
  <div class="row"><div><b>VIP</b><small>TT$300</small></div><div class="step"><button class="minus">−</button><span class="q">0</span><button>+</button></div></div>
  <div class="row"><div><b>Cooler fee</b><small>ADD-ON • TT$50</small></div><div class="step"><button class="minus">−</button><span class="q">1</span><button>+</button></div></div>
</div>
<div class="sum">
  <div class="r"><span>2 × General</span><span>TT$200</span></div>
  <div class="r"><span>1 × Cooler fee</span><span>TT$50</span></div>
  <div class="r tot"><span>Total</span><span>TT$250</span></div>
  <p class="note">Payment plan available — TT$75 deposit today, the balance before the night.</p>
</div>
<button class="cta">Place order — TT$250</button>
<div class="foot">POWERED BY TICKET OFFICE</div>
</div></body></html>
