<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option E — Royal Navy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box} body{margin:0;background:#F7F3EA;color:#0F2B52;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.phone{max-width:430px;margin:0 auto;padding:24px 20px 36px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em}
.pill{background:#0F2B52;color:#E9D9A8;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.poster{width:100%;border-radius:14px;display:block;box-shadow:0 18px 40px rgba(15,43,82,.22)}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:22px 0 4px}
.meta{color:#5E6E8C;font-size:14.5px;font-weight:600;margin-bottom:22px}
.card{background:#fff;border-radius:14px;padding:8px 20px;box-shadow:0 8px 28px rgba(15,43,82,.10);margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #EAE3CF}
.row:last-child{border-bottom:none}
.row b{font-size:16.5px}.row small{display:block;color:#5E6E8C;font-weight:700;margin-top:2px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:38px;height:38px;border-radius:50%;border:none;background:#EFE9D8;color:#0F2B52;font-size:20px;font-weight:800}
.step button.plus{background:#C9A24B;color:#0F2B52}
.step .q{font-weight:800;min-width:18px;text-align:center;font-size:16px}
.sum{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 28px rgba(15,43,82,.10)}
.sum .r{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;font-weight:600;color:#3C4358}
.sum .tot{border-top:1px solid #EAE3CF;margin-top:9px;padding-top:12px;font-size:19px;font-weight:800;color:#0F2B52}
.note{background:#FBF4DE;color:#6E5518;border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:600;line-height:1.5;margin-top:12px}
.cta{display:block;width:100%;margin-top:18px;background:#0F2B52;color:#fff;border:none;border-radius:999px;padding:18px;font-size:17px;font-weight:800}
.foot{text-align:center;color:#A79B78;font-size:12px;margin-top:16px;font-weight:600}
</style></head><body><div class="phone">
<div class="top"><div class="brand">Ticket Office</div><div class="pill">OPTION E</div></div>
<img class="poster" src="https://sjrubwotogjaxzeapndh.supabase.co/storage/v1/object/public/flyers/rhythm-reggae.jpg" alt="Rhythm and Reggae flyer">
<h1>Rhythm &amp; Reggae</h1>
<div class="meta">Sat, 28 Nov 2026 • 7:00 PM • Camp Ogden</div>
<div class="card">
  <div class="row"><div><b>General</b><small>TT$100</small></div><div class="step"><button>−</button><span class="q">2</span><button class="plus">+</button></div></div>
  <div class="row"><div><b>VIP</b><small>TT$300</small></div><div class="step"><button>−</button><span class="q">0</span><button class="plus">+</button></div></div>
  <div class="row"><div><b>Cooler fee</b><small>Add-on • TT$50</small></div><div class="step"><button>−</button><span class="q">1</span><button class="plus">+</button></div></div>
</div>
<div class="sum">
  <div class="r"><span>2 × General</span><span>TT$200</span></div>
  <div class="r"><span>1 × Cooler fee</span><span>TT$50</span></div>
  <div class="r tot"><span>Total</span><span>TT$250</span></div>
  <div class="note">Payment plan available — TT$75 deposit today, the balance before the night.</div>
</div>
<button class="cta">Place order — TT$250</button>
<div class="foot">Powered by Ticket Office</div>
</div></body></html>
